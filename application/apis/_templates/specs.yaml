info:
  title: Luma Backend API Docs
  version: 0.0.0
  description: >-
    Welcome to the **Luma Backend API documentation**. This API provides a
    simple, secure, and efficient way to interact with **your platform's data,
    services, or tools**.

    Designed for developers, system integrators, and partners, our API enables
    you to automate tasks, integrate with third-party services, and build
    powerful applications on top of the **Luma Backend platform**.
tags:
  - name: User module
    description: The User Module provides all endpoints and operations related to
      user management within the system. It handles user registration,
      authentication, profile management, and access control. Through this
      module, developers can create, read, update, and delete user data
      securely, as well as manage user roles and permissions.
  - name: Geos module
    description: The Geos Module provides all endpoints and operations related to
      geo spatial within the system.
  - name: Luma module
    description: The Luma Module provides all endpoints and operations related to
      luma within the system.
paths:
  /api/v1/geos/aoi:
    post:
      tags:
        - Geos module
      summary: aoi post
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: AoiPostOk
                required:
                  - message
                  - data
                  - geometry
                properties:
                  data:
                    $ref: "#/components/schemas/Aoi"
                  message:
                    type: string
                    examples:
                      - success
                  geometry:
                    $ref: "#/components/schemas/Geometry"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: post area of interests
      operationId: aoiPost
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - geometry
              properties:
                geometry:
                  $ref: "#/components/schemas/Geometry"
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        required: true
        description: ""
  /api/v1/users/me:
    get:
      tags:
        - User module
      summary: me
      security:
        - Authorization: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: get current logged in user information
      operationId: me
  /api/v1/luma/lulc-map:
    get:
      tags:
        - Luma module
      summary: lulc map generate
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LumaInputSummaryOk
                required:
                  - message
                  - results
                properties:
                  message:
                    type: string
                    examples:
                      - success
                  results:
                    type: object
                    required:
                      - layers
                      - importance
                      - model_quality
                      - lulc_composition
                    properties:
                      layers:
                        type: array
                        items:
                          type: object
                          required:
                            - url
                            - name
                          properties:
                            url:
                              type: string
                              examples:
                                - https://earthengine.googleapis.com/v1/projects/ee-epstm2024/maps/fdb1baf8b69e711636827dcee5a6a066-4793e995a6df89ee0be9e026e4ad767d/tiles/{z}/{x}/{y}
                            name:
                              type: string
                              examples:
                                - Land Cover Classification
                      importance:
                        type: array
                        items:
                          type: object
                          required:
                            - Band
                            - Importance
                          properties:
                            Band:
                              type: string
                              examples:
                                - SWIR1
                            Importance:
                              type: number
                              examples:
                                - 35.6997246784049
                      model_quality:
                        type: object
                        required:
                          - average_f1_score
                          - gmean_score
                          - overall_accuracy
                          - kappa
                        properties:
                          kappa:
                            type: number
                            examples:
                              - 0.49999999999999983
                          gmean_score:
                            type: number
                            examples:
                              - 0.7476743906106103
                          average_f1_score:
                            type: number
                            examples:
                              - 0.0943181818181818
                          overall_accuracy:
                            type: number
                            examples:
                              - 82.14285714285714
                      lulc_composition:
                        type: array
                        items:
                          type: object
                          properties:
                            class_id:
                              type: integer
                              examples:
                                - 15
                            class_name:
                              type: string
                              examples:
                                - Settlement
                            class_color:
                              type: string
                              description: "#FF0000"
                              examples:
                                - FF0000
                            area_m2:
                              type: number
                              examples:
                                - 91091325.30519158
                            proportion:
                              type: number
                              examples:
                                - 48.58938359575814
                          required:
                            - class_id
                            - class_name
                            - class_color
                            - area_m2
                            - proportion
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: lulc map generate
      operationId: lulcMapGenerate
  /api/v1/geos/aoi/upload:
    post:
      tags:
        - Geos module
      summary: aoi upload
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: AoiUploadOk
                required:
                  - message
                  - data
                  - geometry
                properties:
                  data:
                    $ref: "#/components/schemas/Aoi"
                  message:
                    type: string
                    examples:
                      - success
                  geometry:
                    $ref: "#/components/schemas/Geometry"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: upload area of interests
      operationId: aoiUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - session_id
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        required: true
  /api/v1/luma/image-mosaic:
    get:
      tags:
        - Luma module
      summary: image mosaic get
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: ImageMosaicGetOk
                required:
                  - message
                  - layers
                properties:
                  layers:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - url
                      properties:
                        url:
                          type: string
                          examples:
                            - https://earthengine.googleapis.com/v1/projects/epistem/maps/ac3467220333f851ced1935db1e86067-1c02bae11368ada8cd2dc2ae2710f526/tiles/{z}/{x}/{y}
                        name:
                          type: string
                          examples:
                            - Composite - Land/Water (NIR/SWIR1/RED)
                  message:
                    type: string
                    examples:
                      - success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
        - in: query
          name: start_date
          style: form
          schema:
            type: string
            examples:
              - 2020-01-01
          explode: true
          required: false
          description: ""
          allowReserved: false
        - in: query
          name: end_date
          style: form
          schema:
            type: string
            examples:
              - 2020-12-31
          explode: true
          required: false
          description: ""
          allowReserved: false
      description: get image mosaic earth engine layers
      operationId: imageMosaicGet
  /api/v1/luma/lulc-classes:
    post:
      tags:
        - Luma module
      summary: lulc class update
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LulcClassUpdateOk
                required:
                  - message
                  - classes
                  - training_data
                  - training_data_summary
                properties:
                  message:
                    type: string
                    examples:
                      - success
                  classes:
                    type: array
                    items:
                      $ref: "#/components/schemas/LulcClass"
                  training_data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingData"
                  training_data_summary:
                    type: array
                    items:
                      type: object
                      required:
                        - class_id
                        - class_name
                        - class_color
                        - total_items
                      properties:
                        class_id:
                          type: integer
                          examples:
                            - 1
                        class_name:
                          type: string
                          examples:
                            - Permukiman
                        class_color:
                          type: string
                          examples:
                            - "006400"
                          description: "#006400"
                        total_items:
                          type: integer
                          examples:
                            - 1
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: define lulc class schema, supposedly step-2
      operationId: lulcClassUpdate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - classes
              properties:
                classes:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - class
                      - color
                    properties:
                      id:
                        type: integer
                        examples:
                          - 1
                      class:
                        type: string
                        examples:
                          - Permukiman
                      color:
                        type: string
                        examples:
                          - "006400"
                        description: "#006400"
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        required: true
        description: ""
    delete:
      tags:
        - Luma module
      summary: lulc class reset
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LulcClassResetOk
                required:
                  - message
                  - data
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    examples:
                      - success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: reset lulc class schema, supposedly step-2
      operationId: lulcClassReset
  /api/v1/luma/input-summary:
    get:
      tags:
        - Luma module
      summary: luma input summary
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LumaInputSummaryOk
                required:
                  - message
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - luma_params
                      - training_data_summary
                      - aoi
                    properties:
                      aoi:
                        $ref: "#/components/schemas/Aoi"
                      luma_params:
                        $ref: "#/components/schemas/Luma"
                      training_data_summary:
                        type: array
                        items:
                          type: object
                          required:
                            - class_id
                            - class_name
                            - class_color
                            - total_items
                          properties:
                            class_id:
                              type: integer
                              examples:
                                - 1
                            class_name:
                              type: string
                              examples:
                                - Permukiman
                            class_color:
                              type: string
                              examples:
                                - "006400"
                              description: "#006400"
                            total_items:
                              type: integer
                              examples:
                                - 1
                  message:
                    type: string
                    examples:
                      - success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: get all input params all step
      operationId: lumaInputSummary
  /api/v1/luma/training-data:
    post:
      tags:
        - Luma module
      summary: training data update
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: TrainingDataPostOk
                required:
                  - message
                  - training_data
                properties:
                  message:
                    type: string
                    examples:
                      - success
                  training_data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingData"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: replace all training data with submitted data, supposedly step-3
      operationId: trainingDataUpdate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - session_id
                - training_data
              properties:
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
                training_data:
                  type: array
                  items:
                    type: object
                    required:
                      - class_id
                      - geometry
                    properties:
                      class_id:
                        type: integer
                        examples:
                          - 1
                      geometry:
                        $ref: "#/components/schemas/Geometry"
        required: true
        description: ""
    delete:
      tags:
        - Luma module
      summary: training data reset
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: TrainingDataResetOk
                required:
                  - message
                  - data
                properties:
                  data:
                    type: object
                  message:
                    type: string
                    examples:
                      - success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters:
        - $ref: "#/components/parameters/session_id"
      description: reset training data, supposedly step-3
      operationId: trainingDataReset
  /api/v1/luma/lulc-classes/upload:
    post:
      tags:
        - Luma module
      summary: lulc class upload
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: LulcClassUploadOk
                required:
                  - message
                  - classes
                properties:
                  classes:
                    type: array
                    items:
                      $ref: "#/components/schemas/LulcClass"
                  message:
                    type: string
                    examples:
                      - success
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: upload lulc class schema
      operationId: lulcClassUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - session_id
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        required: true
  /api/v1/luma/training-data/upload:
    post:
      tags:
        - Luma module
      summary: training data upload
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                title: TrainingDataUploadOk
                required:
                  - message
                  - training_data
                properties:
                  message:
                    type: string
                    examples:
                      - success
                  training_data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrainingData"
          description: Success
        "400":
          $ref: "#/components/responses/Bad Request"
        "401":
          $ref: "#/components/responses/No Auth"
        "500":
          $ref: "#/components/responses/Internal Server Error"
      parameters: []
      description: parse and preview training data from uploaded file without saving to database, supposedly step-3
      operationId: trainingDataUpload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - session_id
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
                session_id:
                  type: string
                  examples:
                    - b06e52c5-694d-4890-9a0e-ae9e4a581da5
openapi: 3.1.0
servers:
  - url: http://someserversurl.com
    description: base url
components:
  schemas:
    Aoi:
      type: object
      required:
        - id
        - area_size
        - session_id
        - created_date
        - modified_date
      properties:
        id:
          type: integer
          examples:
            - 1
        area_size:
          type: number
          examples:
            - 22.55
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        created_date:
          type: string
          examples:
            - 2025-10-12T11:01:55.359868
        modified_date:
          type: string
          examples:
            - 2025-10-12T11:01:55.359868
      description: Area of Interests
    Luma:
      type: object
      required:
        - session_id
        - start_date
        - end_date
        - landsat_version
        - cloud_cover
        - created_date
        - modified_date
      properties:
        end_date:
          type: string
          examples:
            - 2020-01-01T00:00:00
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        start_date:
          type: string
          examples:
            - 2020-01-01T00:00:00
        cloud_cover:
          type: integer
          examples:
            - 30
        created_date:
          type: string
          examples:
            - 2020-01-01T00:00:00
        modified_date:
          type: string
          examples:
            - 2020-01-01T00:00:00
        landsat_version:
          type: string
          examples:
            - L8_SR
      description: ""
    Account:
      type: object
      required:
        - email
        - password
        - fullname
        - id
        - is_admin
      properties:
        id:
          type: string
          examples:
            - ad300364-1684-4be3-9052-a61a6d897ae9
        email:
          type: string
          examples:
            - dev@mail.com
        fullname:
          type: string
          examples:
            - Dev
        is_admin:
          type: boolean
        password:
          type: string
          examples:
            - hashed
      description: user account models
    Geometry:
      type: object
      required:
        - coordinates
        - type
      properties:
        type:
          type: string
          examples:
            - Point
            - Polygon
            - Multipolygon
        coordinates:
          type: array
          items:
            type: number
            format: float
            examples:
              - 103.87751306931531
      description: ""
    LulcClass:
      type: object
      required:
        - class_id
        - class_name
        - class_color
        - sesssion_id
        - id
      properties:
        id:
          type: integer
          examples:
            - 1
        class_id:
          type: integer
          examples:
            - 1
        class_name:
          type: string
          examples:
            - Permukiman
        class_color:
          type: string
          examples:
            - "006400"
          description: "#006400"
        sesssion_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
      description: ""
    TrainingData:
      type: object
      required:
        - class_id
        - class_name
        - class_color
        - geometry
        - session_id
      properties:
        class_id:
          type: integer
          examples:
            - 1
        geometry:
          $ref: "#/components/schemas/Geometry"
        class_name:
          type: string
          examples:
            - Permukiman
        session_id:
          type: string
          examples:
            - b06e52c5-694d-4890-9a0e-ae9e4a581da5
        class_color:
          type: string
          examples:
            - "006400"
          description: "#006400"
      description: ""
    FailedResponse:
      type: object
      required:
        - stack
        - trace
        - success
        - error
      properties:
        error:
          $ref: "#/components/schemas/FailedErrorEnum"
        stack:
          type: array
          items:
            $ref: "#/components/schemas/FailedErrorStack"
        trace:
          type: string
          examples:
            - please provide json data
        success:
          type: boolean
      description: base models for failed requests
    FailedErrorEnum:
      type: object
      required:
        - code
        - message
      properties:
        code:
          enum:
            - ERR_VALIDATION
            - ERR_UNAUTHORIZED
            - ERR_FORBIDDEN
            - ERR_NOT_FOUND
            - ERR_INTERNAL
          type: string
          examples:
            - ERR_VALIDATION
        message:
          enum:
            - Invalid input data
            - Unauthorized
            - Forbidden
            - Resource not found
            - Internal server error
          type: string
          examples:
            - Invalid input data
      description: error enum for failed response
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
      description: success
    FailedErrorStack:
      type: object
      required:
        - message
        - field
        - row
      properties:
        row:
          type: number
          examples:
            - 0
        field:
          type: string
          examples:
            - name
        message:
          type: string
          examples:
            - name is required
      description: error stack base models for failed requests
  responses:
    No Auth:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server encountered the client's request to an API lacks valid
        authentication credentials. This specifically means that the API key
        provided is either missing, invalid, or does not grant the necessary
        permissions to access the requested resource.
    Bad Request:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
    Internal Server Error:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FailedResponse"
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request. Report the issue to the support team if it
        persists.
  parameters:
    id:
      in: query
      name: id
      style: form
      schema:
        type: string
        examples:
          - c6276049-3d5f-4396-933a-a0318b2b2e09
      explode: true
      required: true
      description: "id, sample: `c6276049-3d5f-4396-933a-a0318b2b2e09`"
      allowReserved: false
    keywords:
      in: query
      name: keywords
      style: form
      schema:
        type: string
        examples:
          - asd
      explode: true
      description: string to search
      allowReserved: false
      allowEmptyValue: false
    search_by:
      in: query
      name: search_by
      style: form
      schema:
